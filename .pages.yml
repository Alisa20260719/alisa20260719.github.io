media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - pdf
  - txt
  - md
  - docx
content:
- name: writing
  label: 写作与稿件
  type: file
  path: data/writing.json
  format: json
  fields:
  - &id001
    name: id
    label: 唯一标识（英文，不要修改已有标识）
    type: string
    required: true
  - &id002
    name: title
    label: 名称
    type: string
    required: true
  - &id003
    name: cover
    label: 封面 / Logo
    type: image
  - &id004
    name: summary
    label: 简短介绍
    type: text
  - &id005
    name: body
    label: 详细介绍
    type: text
  - &id006
    name: link
    label: 完整作品链接
    type: string
  - &id007
    name: visible
    label: 公开展示
    type: boolean
    default: true
  - name: case
    label: 原有模板
    type: string
  - name: onTree
    label: 在灵感树生成圆灯
    type: boolean
    default: false
  - name: category
    label: 分类
    type: string
  - &id008
    name: documents
    label: 稿件列表
    type: object
    list: true
    fields:
    - name: title
      label: 稿件名称
      type: string
      required: true
    - name: path
      label: 稿件文件（PDF / TXT / MD / DOCX）
      type: file
      required: true
    - name: readPath
      label: 可选：Word对应的TXT阅读文件
      type: file
- name: works
  label: 作品案例 · 灵感树
  type: file
  path: data/works.json
  format: json
  fields:
  - name: items
    label: 条目（按列表顺序展示）
    type: object
    list: true
    fields:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - name: category
      label: 类别
      type: string
    - name: onTree
      label: 在灵感树生成圆灯
      type: boolean
      default: true
    - name: media
      label: 视频 / 音频地址
      type: string
    - name: case
      label: 原有详细案例模板（新增可留空）
      type: string
    - *id008
- name: brands
  label: 品牌墙
  type: file
  path: data/brands.json
  format: json
  fields:
  - name: items
    label: 条目（按列表顺序展示）
    type: object
    list: true
    fields:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - name: case
      label: 原有详细案例模板（新增可留空）
      type: string
- name: hotspots
  label: 人生盒子 · 物件入口
  type: file
  path: data/hotspots.json
  format: json
  fields:
  - name: items
    label: 条目（按列表顺序展示）
    type: object
    list: true
    fields:
    - name: id
      label: 物件标识（保留不变）
      type: string
      required: true
    - name: title
      label: 名称
      type: string
      required: true
    - name: target
      label: 打开目标：案例标识 / about / locked:travel 等
      type: string
      required: true
    - name: x
      label: 新增热点横坐标百分比
      type: number
    - name: y
      label: 新增热点纵坐标百分比
      type: number
    - name: visible
      label: 显示入口
      type: boolean
      default: true
- name: about
  label: 关于我
  type: file
  path: data/about.json
  format: json
  fields:
  - name: name
    label: 姓名
    type: string
  - name: image
    label: 照片
    type: image
  - name: heading
    label: 标题
    type: string
  - name: lead
    label: 引言
    type: text
  - name: body
    label: 个人介绍
    type: text
  - name: tags
    label: 标签
    type: string
    list: true
  - name: beliefs
    label: 创作理念
    type: object
    list: true
    fields:
    - name: title
      label: 标题
      type: string
    - name: body
      label: 说明
      type: text
- name: reading
  label: 阅读迷宫 · 书籍与笔记
  type: file
  path: data/reading.json
  format: json
  fields:
  - name: title
    label: 迷宫标题
    type: string
    required: true
  - name: description
    label: 开场介绍
    type: text
  - name: items
    label: 书籍（新增后自动加入随机探索）
    type: object
    list: true
    fields:
    - name: id
      label: 唯一标识（新增可用 book-109；已有不要改）
      type: string
      required: true
    - name: title
      label: 书名
      type: string
      required: true
    - name: cover
      label: 书籍封面
      type: image
    - name: year
      label: 读完年份
      type: number
    - name: visible
      label: 参与随机探索
      type: boolean
      default: true
    - name: recommendation
      label: 我为什么推荐它
      type: text
    - name: notes
      label: 关键摘录与我的笔记
      type: text
    - name: reflection
      label: 它打开的边界
      type: text
    - name: y
      label: 原截图封面位置（系统保留）
      type: number
      hidden: true
    - name: coverX
      label: 原封面横坐标（系统保留）
      type: number
      hidden: true

- name: travel
  label: 世界的回信 · 地图与旅行手记
  type: file
  path: data/travel.json
  format: json
  fields:
  - name: title
    label: 页面标题
    type: string
    required: true
  - name: description
    label: 开场介绍
    type: text
  - name: places
    label: 地点（新增后自动生成地图锚点）
    type: object
    list: true
    fields:
    - name: name
      label: 地点名称（记录关联时填写同名；已有名称请保持一致）
      type: string
      required: true
    - name: country
      label: 国家 / 省份
      type: string
    - name: region
      label: 地图区域
      type: select
      options:
        values:
        - value: world
          label: 世界地图（其他地区）
        - value: asia
          label: 中国 / 东亚
        - value: europe
          label: 欧洲
      required: true
    - name: x
      label: 地图横向位置 0–100（可用地图选点工具获取）
      type: number
      required: true
    - name: y
      label: 地图纵向位置 0–100（可用地图选点工具获取）
      type: number
      required: true
    - name: visible
      label: 显示地点
      type: boolean
      default: true
  - name: items
    label: 旅行记录（按日期自动组成时间轴）
    type: object
    list: true
    fields:
    - name: id
      label: 记录编号（新增使用未用过的数字）
      type: number
      required: true
    - name: title
      label: 这段记忆的标题
      type: string
      required: true
    - name: date
      label: 日期 YYYY-MM-DD（决定时间轴年份）
      type: string
      required: true
    - name: locations
      label: 关联地点（填写地点列表中的名称；支持多个）
      type: string
      list: true
      required: true
    - name: screenshot
      label: 朋友圈主体截图 / 照片
      type: image
    - name: experience
      label: 当时的事件与经历
      type: text
    - name: reflection
      label: 当时的感想 / 今天回看
      type: text
    - name: visible
      label: 公开展示
      type: boolean
      default: true
    - name: video
      label: 这是一张视频封面截图
      type: boolean
      default: false
    - name: note
      label: 地点核对备注（仅后台保留）
      type: text
  - name: maps
    label: 地图底图（可替换为更高清图片）
    type: object
    fields:
    - name: world
      label: 世界地图
      type: image
    - name: asia
      label: 东亚地图
      type: image
    - name: europe
      label: 欧洲地图
      type: image
